{% extends 'base.html' %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-7 col-lg-5">
  <div class="glass glass-body p-4">
    <h2 class="page-title mb-1">Create your account</h2><p class="text-muted">Your history stays private to you.</p>
    <form method="post" novalidate>{% csrf_token %}
      {% include 'tools/_form_fields.html' with form=form %}
      <button class="btn btn-grad w-100" type="submit">Sign up</button>
    </form>
    <p class="text-muted small mt-3 mb-0">Already registered? <a href="{% url 'accounts:login' %}">Log in</a></p>
  </div>
</div></div></div>
{% endblock %}
